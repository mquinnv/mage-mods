# Distant Horizons configuration override, shipped by the mage-mods pack builder.
#
# Distant Horizons' ConfigFileHandler tolerates a partial file: on first load it
# fills in every key we don't specify with its own defaults, then rewrites this
# file to the full default set. So this file only needs to contain the one key
# we actually want to force.
#
# Why: on MC 26.1.2+ Distant Horizons defaults renderingEngine to BLAZE_3D, but
# Iris does not yet support DH's BLAZE_3D rendering engine on MC 26.2. Forcing
# OPEN_GL here is the documented workaround so DH terrain renders correctly
# together with Iris shaders for every player using this pack (not a per-user
# manual settings change).
#
# Source (verified against the Distant Horizons Core source, not guessed):
#   com.seibel.distanthorizons.core.config.Config.Client.Advanced.Graphics.Experimental.renderingEngine
#   Type: EDhApiRenderingEngine, Options: AUTO | OPEN_GL | BLAZE_3D
#   Repo: https://gitlab.com/distant-horizons-team/distant-horizons-core
#     core/src/main/java/com/seibel/distanthorizons/core/config/Config.java
#
# Requires a restart to take effect (same as changing it in-game).

[client.advanced.graphics.experimental]
    renderingEngine = "OPEN_GL"
