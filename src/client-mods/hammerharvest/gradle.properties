# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MC 26.2 class files are v69, so building needs JDK 25+; the default JAVA_HOME here is 21.
# brew's openjdk@25 and openjdk@26 are both really JDK 26.0.1, which targets 25 via --release.
org.gradle.java.home=/opt/homebrew/opt/openjdk@26/libexec/openjdk.jdk/Contents/Home

# Fabric (see https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.154.2+26.2

# Mod
mod_version=1.0.0
maven_group=com.mage.hammerharvest
archives_base_name=hammerharvest
