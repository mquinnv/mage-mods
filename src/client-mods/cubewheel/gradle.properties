# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# MC 26.2 class files are v69, so building needs JDK 25+.
# Using openjdk (27) which satisfies the JDK 25+ requirement.
org.gradle.java.home=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home

# Fabric (see https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.154.2+26.2

# Mod
mod_version=0.1.0
maven_group=com.mage.cubewheel
archives_base_name=cubewheel
